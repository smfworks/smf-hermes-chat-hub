<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Hub</title>
<!-- Lightweight markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent-1: #7ee787;
    --accent-2: #d2a8ff;
    --accent-3: #79c0ff;
    --accent-4: #ffa657;
    --accent-5: #f778ba;
    --accent-6: #a5d6ff;
    --error-red: #f85149;
    --warn-amber: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* ====== GRID VIEW ====== */
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--dim);
    margin-top: 8px;
    font-size: 0.95rem;
  }
  .status-bar {
    text-align: center;
    margin-bottom: 20px;
    font-size: 0.8rem;
    color: var(--dim);
  }
  .status-bar .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-bar .dot.ok { background: var(--accent-1); }
  .status-bar .dot.err { background: var(--error-red); }
  .status-bar .dot.warn { background: var(--warn-amber); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent-1);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .card .avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .card .name { font-size: 1.3rem; font-weight: 700; }
  .card .model { font-size: 0.85rem; color: var(--dim); }
  .card .msg-count { font-size: 0.75rem; color: var(--dim); margin-top: -6px; }
  .card .row { display: flex; align-items: center; gap: 14px; }
  .card .info { display: flex; flex-direction: column; gap: 2px; }
  .card .badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--border);
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card .badge.default { background: rgba(126,231,135,0.15); color: var(--accent-1); }
  .card .clear-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--dim);
    font-size: 0.7rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card:hover .clear-btn { opacity: 1; }
  .card .clear-btn:hover { color: var(--error-red); }
  .c1 .avatar { background: #1a3a2a; color: var(--accent-1); }
  .c2 .avatar { background: #2a1a3a; color: var(--accent-2); }
  .c3 .avatar { background: #1a2a3a; color: var(--accent-3); }
  .c4 .avatar { background: #3a2a1a; color: var(--accent-4); }
  .c5 .avatar { background: #3a1a2a; color: var(--accent-5); }
  .c6 .avatar { background: #1a2a2a; color: var(--accent-6); }

  /* ====== CHAT VIEW ====== */
  #chat-view { display: none; flex-direction: column; height: 100vh; }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn:hover { border-color: var(--accent-1); color: var(--text); }
  .chat-header .avatar-sm {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
  }
  .chat-header .agent-name { font-weight: 700; font-size: 1.1rem; }
  .chat-header .agent-model { color: var(--dim); font-size: 0.8rem; }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.92rem;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--border);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.agent {
    align-self: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  /* Markdown content inside agent messages */
  .msg.agent p { margin: 0 0 0.6em 0; }
  .msg.agent p:last-child { margin-bottom: 0; }
  .msg.agent pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 0.6em 0;
    font-size: 0.85em;
  }
  .msg.agent code {
    background: var(--bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 0.88em;
  }
  .msg.agent pre code {
    background: none;
    padding: 0;
  }
  .msg.agent ul, .msg.agent ol { margin: 0.4em 0; padding-left: 1.5em; }
  .msg.agent li { margin: 0.2em 0; }
  .msg.agent h1, .msg.agent h2, .msg.agent h3 { margin: 0.7em 0 0.3em; }
  .msg.agent blockquote {
    border-left: 3px solid var(--dim);
    margin: 0.5em 0;
    padding-left: 0.8em;
    color: var(--dim);
  }
  .msg.agent a { color: var(--accent-3); }
  .msg.agent table { border-collapse: collapse; margin: 0.6em 0; }
  .msg.agent th, .msg.agent td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg.agent th { background: var(--bg); }
  .msg.thinking {
    align-self: flex-start;
    color: var(--dim);
    font-style: italic;
    background: transparent;
    border: none;
    padding: 8px 16px;
  }
  .msg.error {
    align-self: center;
    color: var(--error-red);
    background: rgba(248,81,73,0.1);
    border: 1px solid rgba(248,81,73,0.3);
    border-radius: 8px;
    font-size: 0.85rem;
    text-align: center;
    max-width: 90%;
    position: relative;
  }
  .msg.error .retry-btn {
    display: inline-block;
    margin-top: 8px;
    background: rgba(248,81,73,0.2);
    border: 1px solid rgba(248,81,73,0.4);
    color: var(--error-red);
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .msg.error .retry-btn:hover {
    background: rgba(248,81,73,0.3);
  }
  .retrying-indicator {
    align-self: flex-start;
    color: var(--warn-amber);
    font-style: italic;
    font-size: 0.85rem;
    padding: 8px 16px;
  }
  .chat-input-wrap {
    flex-shrink: 0;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 120px;
  }
  .chat-input:focus { border-color: var(--accent-1); }
  .send-btn {
    background: rgba(126,231,135,0.15);
    border: 1px solid var(--accent-1);
    color: var(--accent-1);
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: rgba(126,231,135,0.25); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cancel-btn {
    background: rgba(248,81,73,0.15);
    border: 1px solid var(--error-red);
    color: var(--error-red);
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
    display: none;
  }
  .cancel-btn:hover { background: rgba(248,81,73,0.25); }

  .footer {
    margin-top: 48px;
    text-align: center;
    color: var(--dim);
    font-size: 0.8rem;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.visible { opacity: 1; pointer-events: auto; }
  .toast.error { border-color: var(--error-red); color: var(--error-red); }
  .toast.warn { border-color: var(--warn-amber); color: var(--warn-amber); }
</style>
</head>
<body>
<!-- ====== GRID VIEW ====== -->
<div id="grid-view">
  <div class="container">
    <header>
      <h1>⚡ Hermes Hub</h1>
      <p>Click an agent to open a chat session</p>
    </header>
    <div class="status-bar" id="status-bar">
      <span class="dot ok" id="status-dot"></span>
      <span id="status-text">Checking backend…</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="footer">Hermes Agent · Chat on demand · Sessions auto-saved</div>
  </div>
</div>

<!-- ====== CHAT VIEW ====== -->
<div id="chat-view">
  <div class="chat-header">
    <button class="back-btn" onclick="backToGrid()">← Hub</button>
    <div class="avatar-sm" id="chat-avatar"></div>
    <div>
      <div class="agent-name" id="chat-name"></div>
      <div class="agent-model" id="chat-model"></div>
    </div>
    <div style="flex:1"></div>
    <button class="back-btn" onclick="clearChat()">New Chat</button>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-input-wrap">
    <textarea class="chat-input" id="chat-input"
      placeholder="Type a message…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    <button class="cancel-btn" id="cancel-btn" onclick="cancelRequest()">Cancel</button>
  </div>
</div>

<!-- Toast for notifications -->
<div class="toast" id="toast"></div>

<script>
// ── Config ──────────────────────────────────────────────────────────────
const API_HOST = window.location.hostname;
const API = `http://${API_HOST}:9099`;
const MAX_RETRIES = 2;
const RETRY_DELAYS = [2000, 4000]; // ms, exponential
const HEALTH_POLL_INTERVAL = 30000; // 30s

const agents = [
  { id: "default", name: "Default", emoji: "H", model: "deepseek-v4-pro",          color: "c1", badge: "default" },
  { id: "drj",    name: "Dr J",    emoji: "J", model: "deepseek-v4-pro:cloud",     color: "c2", badge: "" },
  { id: "harry",  name: "Harry",   emoji: "H", model: "kimi-k2.6:cloud",           color: "c3", badge: "harry" },
  { id: "liam",   name: "Liam",    emoji: "L", model: "deepseek-v4-pro:cloud",     color: "c4", badge: "liam" },
  { id: "naill",  name: "Naill",   emoji: "N", model: "deepseek-v4-pro:cloud",     color: "c5", badge: "naill" },
  { id: "zayn",   name: "Zayn",    emoji: "Z", model: "deepseek-v4-pro:cloud",      color: "c6", badge: "zayn" },
];

const ORIGINAL_ACCENT = '#7ee787';
let currentAgent = null;
let currentAbortController = null; // for cancelling in-flight requests
let isSending = false;
let lastUserMessage = '';          // for auto-retry
let healthCheckTimer = null;

// ── Markdown config ──────────────────────────────────────────────────────
if (typeof marked !== 'undefined') {
  marked.setOptions({
    breaks: true,
    gfm: true,
  });
}

// ── Toast Notifications ──────────────────────────────────────────────────
let toastTimeout = null;
function showToast(message, type = '', duration = 4000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast visible ' + type;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { toast.className = 'toast'; }, duration);
}

// ── Session Persistence (localStorage) ──────────────────────────────────
const STORAGE_KEY = 'hermes-hub-sessions';

function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveSessions(sessions) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  } catch (e) {
    console.warn('Failed to save sessions to localStorage:', e);
  }
}

/** Each session: { messages: [{role, text}], sessionId: string|null } */
function getSession(agentId) {
  const sessions = loadSessions();
  return sessions[agentId] || { messages: [], sessionId: null };
}

function updateSession(agentId, data) {
  const sessions = loadSessions();
  sessions[agentId] = { ...sessions[agentId], ...data };
  saveSessions(sessions);
}

function clearSession(agentId) {
  const sessions = loadSessions();
  delete sessions[agentId];
  saveSessions(sessions);
  // Also tell the backend to forget the session ID
  fetch(`${API}/${agentId}`, { method: 'DELETE' }).catch(() => {});
}

// ── Health Check (periodic) ──────────────────────────────────────────────
async function checkHealth() {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  try {
    const res = await fetch(`${API}/health`, { signal: AbortSignal.timeout(5000) });
    const data = await res.json();
    dot.className = 'dot ok';
    text.textContent = data.hermes ? 'Backend online' : 'Backend up — hermes not found';
    if (!data.hermes) dot.className = 'dot err';
  } catch {
    dot.className = 'dot err';
    text.textContent = 'Backend offline — start it: python3 ~/hermes-hub/backend.py';
  }
}

function startHealthPolling() {
  checkHealth(); // immediate
  if (healthCheckTimer) clearInterval(healthCheckTimer);
  healthCheckTimer = setInterval(checkHealth, HEALTH_POLL_INTERVAL);
}

// ── Build Grid ───────────────────────────────────────────────────────────
const grid = document.getElementById('grid');
agents.forEach(a => {
  const session = getSession(a.id);
  const msgCount = session.messages.length;
  const card = document.createElement('div');
  card.className = `card ${a.color}`;
  card.dataset.agentId = a.id;
  card.onmouseenter = () => updateCardCount(a.id);
  card.onclick = (e) => {
    if (e.target.classList.contains('clear-btn')) return;
    openChat(a);
  };
  card.innerHTML = `
    ${a.badge === 'default'
      ? '<span class="badge default">Default</span>'
      : (a.badge ? `<span class="badge">${a.badge}</span>` : '')}
    <div class="row">
      <div class="avatar">${a.emoji}</div>
      <div class="info">
        <div class="name">${a.name}</div>
        <div class="model">${a.model}</div>
        <div class="msg-count" data-count="${a.id}">${msgCount ? msgCount + ' messages' : 'No conversation yet'}</div>
      </div>
    </div>
    <button class="clear-btn" onclick="event.stopPropagation(); confirmClear('${a.id}')">Clear history</button>
  `;
  grid.appendChild(card);
});

function updateCardCount(agentId) {
  const session = getSession(agentId);
  const el = document.querySelector(`[data-count="${agentId}"]`);
  if (el) {
    const n = session.messages.length;
    el.textContent = n ? `${n} messages` : 'No conversation yet';
  }
}

function confirmClear(agentId) {
  if (confirm('Clear chat history for this agent?')) {
    clearSession(agentId);
    updateCardCount(agentId);
    // If currently in this chat view, refresh
    if (currentAgent && currentAgent.id === agentId) {
      renderChatHistory();
    }
  }
}

// ── Chat Navigation ──────────────────────────────────────────────────────
const ACCENT_MAP = {
  c1: '#7ee787', c2: '#d2a8ff', c3: '#79c0ff',
  c4: '#ffa657', c5: '#f778ba', c6: '#a5d6ff'
};

function openChat(agent) {
  currentAgent = agent;
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('chat-view').style.display = 'flex';
  document.getElementById('chat-avatar').textContent = agent.emoji;
  document.getElementById('chat-avatar').className = `avatar-sm ${agent.color}`;
  document.getElementById('chat-name').textContent = agent.name;
  document.getElementById('chat-model').textContent = agent.model;

  // Set accent color for this agent
  document.documentElement.style.setProperty('--accent-1', ACCENT_MAP[agent.color] || ORIGINAL_ACCENT);

  // Update page title
  document.title = `${agent.name} — Hermes Hub`;

  renderChatHistory();
  document.getElementById('chat-input').value = '';
  document.getElementById('chat-input').focus();
}

function backToGrid() {
  document.getElementById('chat-view').style.display = 'none';
  document.getElementById('grid-view').style.display = 'block';
  // Restore original accent color
  document.documentElement.style.setProperty('--accent-1', ORIGINAL_ACCENT);
  document.title = 'Hermes Hub';
  currentAgent = null;
  // Refresh message counts on cards
  agents.forEach(a => updateCardCount(a.id));
}

function clearChat() {
  if (!currentAgent) return;
  if (!confirm('Start a new chat? Current history will be cleared.')) return;
  clearSession(currentAgent.id);
  document.getElementById('chat-body').innerHTML = '';
  document.getElementById('chat-input').focus();
  showToast('Chat history cleared', '', 2000);
}

// ── Render Messages ──────────────────────────────────────────────────────
function renderChatHistory() {
  const body = document.getElementById('chat-body');
  body.innerHTML = '';
  if (!currentAgent) return;

  const session = getSession(currentAgent.id);
  for (const msg of session.messages) {
    addMessageDOM(msg.text, msg.role);
  }
  body.scrollTop = body.scrollHeight;
}

function addMessageDOM(text, role, extraHtml = '') {
  const body = document.getElementById('chat-body');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  if (role === 'agent' && typeof marked !== 'undefined') {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }

  if (extraHtml) {
    div.insertAdjacentHTML('beforeend', extraHtml);
  }
  
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function addMessage(text, role) {
  addMessageDOM(text, role);
  // Persist to localStorage
  if (currentAgent) {
    const session = getSession(currentAgent.id);
    session.messages.push({ role, text });
    updateSession(currentAgent.id, session);
  }
}

// ── Thinking & Error Indicators ───────────────────────────────────────────
function setThinking(show) {
  const body = document.getElementById('chat-body');
  let el = document.getElementById('thinking-msg');
  if (show) {
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg thinking';
      el.id = 'thinking-msg';
      el.textContent = 'Thinking…';
      body.appendChild(el);
    }
  } else if (el) {
    el.remove();
  }
  body.scrollTop = body.scrollHeight;
}

function showError(text, recoverable = false, onRetry = null) {
  const body = document.getElementById('chat-body');
  const div = document.createElement('div');
  div.className = 'msg error';
  
  let html = `<span>${text}</span>`;
  if (recoverable && onRetry) {
    html += `<br><button class="retry-btn" onclick="this.parentElement.remove()">Retry</button>`;
    div.innerHTML = html;
    div.querySelector('.retry-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      div.remove();
      onRetry();
    });
  } else {
    div.innerHTML = html;
  }
  
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

function setSendingState(sending) {
  isSending = sending;
  const btn = document.getElementById('send-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const input = document.getElementById('chat-input');
  btn.disabled = sending;
  input.disabled = sending;
  cancelBtn.style.display = sending ? 'inline-block' : 'none';
  if (!sending) {
    input.focus();
    // Remove any stale retrying indicators
    document.querySelectorAll('.retrying-indicator').forEach(el => el.remove());
  }
}

// ── Cancel In-Flight Request ─────────────────────────────────────────────
function cancelRequest() {
  if (currentAbortController) {
    currentAbortController.abort();
    currentAbortController = null;
  }
  // Also tell the backend to kill the subprocess
  if (currentAgent) {
    fetch(`${API}/cancel/${currentAgent.id}`, { method: 'DELETE' }).catch(() => {});
  }
  setThinking(false);
  setSendingState(false);
  document.querySelectorAll('.retrying-indicator').forEach(el => el.remove());
  showToast('Request cancelled', 'warn', 2000);
}

// ── Send Message (with retry) ────────────────────────────────────────────
async function sendMessage() {
  if (!currentAgent || isSending) return;

  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;

  // Add user message to chat
  addMessage(message, 'user');
  input.value = '';
  input.style.height = '44px';
  lastUserMessage = message;

  await sendMessageWithRetry(message, MAX_RETRIES);
}

async function sendMessageWithRetry(message, retriesLeft) {
  setSendingState(true);
  setThinking(true);

  for (let attempt = 0; attempt <= retriesLeft; attempt++) {
    // Create abort controller for this attempt
    currentAbortController = new AbortController();
    
    if (attempt > 0) {
      // Show retrying indicator
      const retryEl = document.createElement('div');
      retryEl.className = 'retrying-indicator';
      retryEl.textContent = `Retrying (attempt ${attempt + 1}/${retriesLeft + 1})…`;
      retryEl.id = `retry-${attempt}`;
      document.getElementById('chat-body').appendChild(retryEl);
      document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
      
      await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt - 1] || 2000));
    }

    try {
      const res = await fetch(`${API}/${currentAgent.id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
        signal: currentAbortController.signal,
      });

      // Remove any retrying indicators
      document.querySelectorAll('.retrying-indicator').forEach(el => el.remove());

      const data = await res.json();
      setThinking(false);

      if (data.error) {
        // Check if error is recoverable and we have retries left
        const recoverable = data.recoverable !== false;
        if (recoverable && attempt < retriesLeft) {
          // Will retry on next loop iteration
          continue;
        }
        
        // No more retries or non-recoverable — show error with retry button
        const errorDiv = showError(
          data.error,
          recoverable,
          () => sendMessageWithRetry(message, 1) // allow 1 manual retry
        );
        setSendingState(false);
        return;
      }

      // Success!
      const responseText = data.response || '[no response]';
      addMessage(responseText, 'agent');
      
      // Store session ID from backend for resume continuity
      if (data.session_id) {
        const session = getSession(currentAgent.id);
        session.sessionId = data.session_id;
        updateSession(currentAgent.id, session);
      }

      setSendingState(false);
      return;

    } catch (e) {
      // Remove retrying indicators
      document.querySelectorAll('.retrying-indicator').forEach(el => el.remove());

      if (e.name === 'AbortError') {
        // User cancelled
        setThinking(false);
        setSendingState(false);
        return;
      }

      // Network error
      setThinking(false);
      
      if (attempt < retriesLeft) {
        // Will retry on next loop iteration
        continue;
      }

      // All retries exhausted — show error with retry button
      showError(
        `Connection error: ${e.message}. The backend may be down.`,
        true,
        () => sendMessageWithRetry(message, 1)
      );
      setSendingState(false);
      return;
    }
  }

  // Should not reach here, but just in case
  setThinking(false);
  setSendingState(false);
}

// ── Auto-resize textarea ─────────────────────────────────────────────────
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = '44px';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Keyboard shortcut: Escape to go back ─────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && currentAgent) {
    backToGrid();
  }
});

// ── Init ─────────────────────────────────────────────────────────────────
startHealthPolling();
</script>
